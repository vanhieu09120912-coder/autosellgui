name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen zip
        run: |
          mkdir proj
          for z in ./*.zip; do unzip -q "$z" -d proj; done
          DIR=$(dirname "$(find proj -name build.gradle | head -1)")
          echo "DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0
      - run: gradle build --stacktrace
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: autosellgui-jar
          path: |
            ${{ env.DIR }}/build/libs/*.jar
            !${{ env.DIR }}/build/libs/*-sources.jar
